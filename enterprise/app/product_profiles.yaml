          Deliverec y Hubster en un solo punto de venta, eliminando la operación manual entre
          plataformas.
      - atributo: "Módulo de facturación"
        beneficio: "Permite emitir facturas libres, facturas globales y facturas desde un sitio configurable para que el comensal se autofacture."
