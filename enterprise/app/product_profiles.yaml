# Soft Restaurant® — Perfiles de Producto para Recomendación
# Cada entrada define los criterios de selección y el contexto de venta para el agente.
# name_match: substring que se busca en product_service_name de la DB (case-insensitive)
# Solo planes de suscripción principal (7 productos)
#
# Estructura estándar de cada producto:
#   id, nombre, name_match, is_base_plan, categoria, tipo, is_cloud, max_dispositivos,
#   multi_sucursal, precios, perfil_producto, recommendation_rules,
#   buyer_persona, atributos_y_beneficios, promociones, notas,
#   manejo_de_objeciones: { es_caro, lo_pienso, competencia, ya_tenemos_sistema,
#     vs_alternativa, no_quiero_mensualidades, miedo_tecnologia, no_me_funciona, negocio_pequeno }

productos:

  # ──────────────────────────────────────────────
  # PLANES LOCAL (SR® 12)
  # ──────────────────────────────────────────────

  - id: sr12_lite
    nombre: "Soft Restaurant® 12 Lite"
    name_match: "12 Lite"
    is_base_plan: true
    categoria: "Software integral para la gestión, administración y punto de venta de restaurantes"
    tipo: "Local"
    descripcion_tipo: "Versión Instalada (Operación Garantizada: funciona sin internet)"
    is_cloud: false
    max_dispositivos: 2
    multi_sucursal: false
    precios:
      mensual_mxn: 799
      anual_mxn: 8390
    perfil_producto:
      usp: >
        Centraliza, controla y optimiza toda la operación de tu restaurante desde una sola
        plataforma, facilitando la toma de decisiones y mejorando la eficiencia del negocio.
      unidad_de_valor: >
        MXN / Licencias por dispositivo. Licencia de uso por una sucursal que permite operar
        el sistema hasta en 2 dispositivos de forma simultánea, bajo un esquema de renta
        mensual o anual.
    recommendation_rules:
      devices_max: 2
      branch_count_max: 1
      prefers_cloud: false
    buyer_persona:
      segmento: >
        Dueños de restaurantes pequeños, medianos, grandes, multisucursal, cadena de
        restaurantes o franquicias. Tan robusto que se adapta a cualquier tipo de restaurante:
        fondas, taquerías, cafeterías, restaurantes familiares o negocios de comida rápida que
        operan con 1 o 2 puntos de trabajo y quieren profesionalizar su operación sin inversión
        en infraestructura compleja.
      pain_point: >
        Operan sin sistema o con procesos manuales: no tienen visibilidad de sus ventas, no
        controlan su inventario, no detectan errores del personal y pierden tiempo cuadrando
        cierres de caja a mano. Cada turno es un riesgo de descuadre o fuga de dinero.
      gain: >
        Tener el control total de su negocio desde un solo sistema: saber qué se vende, reportes
        de ventas, platillos que se consumen, qué cobra cada cajero y poder tomar decisiones con
        datos reales, sin estar físicamente en el restaurante.
    atributos_y_beneficios:
      - atributo: "Operación de 2 dispositivos en simultáneo"
        beneficio: >
          Permite tener caja y comandero activos (fijo y/o móvil) al mismo tiempo bajo una sola
          licencia, sin pagar por dispositivo adicional. Ideal para restaurantes que están
          estructurando su operación por primera vez. Solo necesitas un equipo principal (puede ser
          una computadora convencional o una POS Touch), y si tu operación lo requiere, puedes
          instalar el sistema en un segundo dispositivo para trabajar de forma simultánea.
      - atributo: "Función de punto de venta en modalidades servicio a comedor, rápido y a domicilio"
        beneficio: >
          Un solo sistema cubre todas las modalidades del negocio: mesero en comedor, mostrador en
          servicio rápido o a domicilio con sincronización de apps de delivery, sin necesidad de
          herramientas separadas. Nuestras licencias son integrales, no tienes que pagar más o
          comprar módulos adicionales para la operación principal de tu negocio.
      - atributo: "Función de inventarios"
        beneficio: >
          Reducción de pérdidas y compras más inteligentes gracias al control de almacén en tiempo
          real. Recibe alertas de existencia, reduce los desperdicios y gestiona los almacenes
          (compras y proveedores) y cálculo de costos y utilidades.
      - atributo: "Facturación electrónica"
        beneficio: "Reducción de fraudes y cierre de caja preciso con conciliaciones automáticas y roles de usuarios."
      - atributo: "Autofactura"
        beneficio: "Reducción de fraudes y cierre de caja preciso con conciliaciones automáticas, emisión con ticket o QR y portal personalizado."
      - atributo: "Función de reservaciones y comisionistas para gestionar reservas"
        beneficio: "Aumento en venta promedio por ticket al incentivar a los meseros con el módulo de comisiones."
      - atributo: "Función de monitor de Producción para agilizar la operación"
        beneficio: "Menos errores y mejor flujo en cocina mediante comandero móvil y pantalla KDS."
      - atributo: "Función de fidelización de clientes"
        beneficio: >
          Permite guardar la información de los clientes como datos de facturación, direcciones de
          entrega, y sus pedidos anteriores para brindarles una mejor atención. Además, brindarles
          beneficios o descuentos especiales con el objetivo de incentivar la compra y fortalecer
          la relación con los clientes.
      - atributo: "Alertas y reportes automáticos vía WhatsApp en tiempo real"
        beneficio: >
          El dueño o administrador recibe por WhatsApp los cortes de caja, alertas de antifraude y
          productos más vendidos al instante, sin necesitar estar en el restaurante para saber qué
          está pasando.
    promociones:
      - "Aplica en versiones 11 en adelante"
      - "Renta Mensual de Analytics y Delivery Hub GRATIS"
      - "Renta Anual de Analytics y Delivery Hub GRATIS"
      - "Incluye 200 CFDI para Facturación electrónica en Renta Anual"
      - >
        20% de descuento en licencia Soft Restaurant® al activar Soft Restaurant® Payments
        (disponible para negocios que procesen más de $100,000 al mes con tarjeta y
        $1,200,000 al año). Aplica consultar términos y condiciones.
    notas: >
      En el nuevo esquema de suscripción de Soft Restaurant® 12, podrás realizar un cambio de datos
      al año en licenciamiento mensual o anual. CFDI se adquieren por separado.
    manejo_de_objeciones:
      es_caro: >
        Entendemos su preocupación, pero Soft Restaurant® es mucho más que un punto de venta.
        Incluye facturación electrónica, control de inventarios, fidelización de clientes, reportes
        automáticos y operación sin internet. Además, está diseñado para adaptarse a sus necesidades
        específicas y crecer con su negocio.

        Totalmente entendible, nadie quiere invertir sin estar seguro. Lo que sí te puedo asegurar
        es que muchos restauranteros que hoy usan Soft Restaurant® tuvieron esa misma duda y hoy nos
        dicen que no sabían cuánto estaban perdiendo sin un software: en cierres de caja, en
        inventario y en tiempo.
      lo_pienso: >
        Entendemos que es una decisión importante. ¿Le gustaría agendar una demostración sin
        compromiso para que lo vea en funcionamiento real antes de decidir?

        Por supuesto. Si en algún momento quieres verlo en acción, podemos hacer una demo rápida
        sin compromiso; nuestros clientes se sorprenden de lo sencillo que es. Cuando lo requieras,
        aquí estamos.
      competencia: >
        Soft Restaurant® 12 integra lo que otros sistemas separan: ventas, inventarios, pagos,
        delivery, facturación y analítica en un solo sistema. Ofrece hasta 30% más agilidad en
        servicio, seguridad única con cortes antifraude en tiempo real, y la mejor relación
        costo-beneficio del mercado. Además, cuenta con Academia gratuita para capacitar a todo
        el staff.
      ya_tenemos_sistema: >
        Si ya cuentas con otro sistema, con Soft Restaurant® 12 obtienes un sistema más completo,
        confiable y diseñado para crecer con tu restaurante. Cuenta con operación integral en un
        solo sistema, integraciones nativas con apps de reparto y pagos con tarjeta, control y
        seguridad avanzada con perfiles de usuario y trazabilidad, reportes en tiempo real desde
        cualquier dispositivo, ecosistema escalable con Add-Ons, y soporte técnico de lunes a
        sábado de 9am a 1am y domingos de 10am a 2pm.
      vs_alternativa: >
        Si necesitas más de 2 dispositivos activos, SR® 12 Pro te da hasta 10 por el mismo estilo
        de instalación. Cuéntame cuántos puntos necesitas y lo afinamos.
      no_quiero_mensualidades: >
        Nuestro modelo de renta mensual le da acceso a actualizaciones constantes, soporte técnico
        y mejora continua del sistema. Siempre tendrá la mejor versión sin costos ocultos por
        mantenimiento o licencias futuras. También contamos con la modalidad de renta anual para
        mayor comodidad.

        Al tener mensualidades, tú sales ganando, ya que la suscripción incluye todas las
        actualizaciones; ya viene todo incluido. Y si el mes a mes no te convence, el plan anual
        es una sola vez al año y listo, te quitas ese pendiente.
      miedo_tecnologia: >
        Soft Restaurant® tiene una interfaz intuitiva y amigable. Incluye capacitación inicial,
        soporte y acceso a nuestra plataforma de formación online (Academia Soft Restaurant®), para
        que todo su equipo se adapte fácilmente.
      no_me_funciona: >
        Podemos agendar una sesión para hacer una demostración para que conozca el sistema antes de
        decidir. Además, ofrecemos capacitación y soporte desde la instalación, asegurando que
        obtenga resultados reales, no solo un software.
      negocio_pequeno: >
        Soft Restaurant® es escalable: puede comenzar con una versión básica e ir agregando módulos
        conforme su negocio crece. Tener control desde el inicio le ahorrará tiempo, errores y
        pérdidas en el futuro.

        Perfecto, de hecho, tenemos Soft Restaurant® Cloud: es nuestra versión en la nube, más
        accesible, sin servidores ni instalaciones complicadas, funciona desde cualquier dispositivo
        con internet. Muchos restaurantes pequeños arrancan con ella y les da exactamente lo que
        necesitan para tener control desde el primer día.

